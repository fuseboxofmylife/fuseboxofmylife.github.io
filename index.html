<title>Щиток мого життя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Onest:wght@400;600;700&display=swap">
<style>
/* Layout: one compact enamel breaker panel; each circuit = switch + label tape side by side; settings slide in from the right as stacked blocks. */
:root{
  --bg:#d9dfe5; --panel:#eef1f4; --edge:#b4bec8; --ink:#34414e; --muted:#5f6b78;
  --tape:#1d2730; --tape-ink:#f3efe4;
  --track-off:#c4ccd4; --amber:#f2a11d; --amber-soft:#f6d69b;
  --ice:#5aa9dc; --danger:#cf3f2b; --knob:#fbfcfd; --knob-ico:#b06a06; --plate:#c9d1d9; --slot:#8e99a5; --chip:#e3e8ed; --card:#ffffff; --card-h:#eaeff3; --sheet:#cfd7df; --on-amber:#2b3640; --amber-ink:#8a5300; --trace:#93a0ad;
  --f-tape:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171c; --panel:#1d232a; --edge:#323c47; --ink:#e6eaee; --muted:#95a1ad;
  --tape:#0b0f13; --tape-ink:#ece5d3;
  --track-off:#2b333c; --amber:#e9a02a; --amber-soft:#5a4420;
  --ice:#4f9dd0; --danger:#ef5a44; --knob:#dfe4e9; --knob-ico:#a8670a; --plate:#262e37; --slot:#141a20; --chip:#28313a; --card:#252e38; --card-h:#2f3a46; --sheet:#0c1014; --on-amber:#1a1408; --amber-ink:#f0b04a; --trace:#3c4956; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --panel:#1d232a; --edge:#323c47; --ink:#e6eaee; --muted:#95a1ad;
  --tape:#0b0f13; --tape-ink:#ece5d3;
  --track-off:#2b333c; --amber:#e9a02a; --amber-soft:#5a4420;
  --ice:#4f9dd0; --danger:#ef5a44; --knob:#dfe4e9; --knob-ico:#a8670a; --plate:#262e37; --slot:#141a20; --chip:#28313a; --card:#252e38; --card-h:#2f3a46; --sheet:#0c1014; --on-amber:#1a1408; --amber-ink:#f0b04a; --trace:#3c4956; color-scheme:dark}

*{box-sizing:border-box}
body{overflow-x:hidden;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:22px 0 -22px}
.lang{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tools{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:8px;background:var(--panel);cursor:pointer}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn:disabled{opacity:.5;cursor:wait}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.box{position:relative}
.wires{position:absolute;inset:0;pointer-events:none}
/* cable bundles run from outside the page edge and disappear under the cover */
.wires svg{position:absolute;overflow:visible;opacity:.85}
.dv{display:none;position:absolute;inset:0}
.box[data-decor="cables"] .dv-cables,.box[data-decor="schematic"] .dv-schematic,.box[data-decor="pcb"] .dv-pcb,.box[data-decor="pins"] .dv-pins{display:block}
/* PCB: thin traces with 45-degree bends ending in via pads */
.dv-pcb svg{opacity:1}
.dv-pcb path{stroke:var(--trace);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dv-pcb circle{fill:var(--bg);stroke:var(--amber);stroke-width:1.8;opacity:.85}
.dv-pcb .pt1{left:8%;top:-34px;width:120px;height:76px}.dv-pcb .pt2{right:24%;top:-34px;width:80px;height:76px}
.dv-pcb .pb1{right:8%;bottom:-34px;width:120px;height:76px}.dv-pcb .pb2{left:22%;bottom:-34px;width:80px;height:76px}
.dv-pcb .pl{left:-34px;top:22%;width:76px;height:120px}.dv-pcb .pr{right:-34px;top:52%;width:76px;height:120px}
/* cables: thick bundles of different gauge; yellow, pale and grey; patch cords plugged into ports at the bottom */
.dv-cables svg{opacity:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.dv-cables path{fill:none;stroke-linecap:round}
.dv-cables line{stroke-linecap:butt}
.dv-cables .cu{position:absolute;overflow:visible}
.dv-cables .ct1{left:5%;top:-2000px;width:150px;height:2046px}.dv-cables .ct2{right:9%;top:-2000px;width:90px;height:2046px}
.dv-cables .cl{left:-2000px;top:58%;width:2046px;height:84px}.dv-cables .cr{right:-2000px;top:44%;width:2046px;height:50px}
.dv-cables .cb{left:max(16%,104px);bottom:-38px;width:2240px;height:46px;z-index:2}
/* chip: the whole panel becomes a chip with metal legs along every edge */
.pin{position:absolute;opacity:.8}
.pin.pt,.pin.pb{left:46px;right:46px;height:10px;background:repeating-linear-gradient(90deg,var(--trace) 0 7px,transparent 7px 19px)}
.pin.pt{top:-10px}.pin.pb{bottom:-10px}
.pin.pl,.pin.pr{top:46px;bottom:46px;width:10px;background:repeating-linear-gradient(180deg,var(--trace) 0 7px,transparent 7px 19px)}
.pin.pl{left:-10px}.pin.pr{right:-10px}
.wires path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wires .c{stroke-width:3.5}
.wires .top{left:12%;top:-34px;width:110px;height:76px}
.wires .bot{right:14%;bottom:-34px;width:90px;height:76px}
.wires .lft{left:-34px;top:30%;width:76px;height:90px}
.wires .rgt{right:-34px;top:60%;width:76px;height:70px}
.panel{position:relative;z-index:1;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:50px 50px 46px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 12px 30px -18px rgba(0,0,0,.45)}
/* the cover: screws sit in a metal frame, the devices sit in a recessed field inside it */
.panel::before{content:"";position:absolute;z-index:-1;inset:26px;border-radius:10px;background:rgba(0,0,0,.05);border:1px solid var(--edge);box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.screw{position:absolute;z-index:2;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#c3cad1 45%,#7d8792 100%);box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 -1px 1px rgba(0,0,0,.25);transform:rotate(var(--r,20deg))}
.screw::before,.screw::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:2px;margin:-1px 0 0 -4.5px;border-radius:1px;background:#4b535c;box-shadow:0 1px 0 rgba(255,255,255,.5)}
.screw::after{transform:rotate(90deg)}
.screw.tl{top:6px;left:6px}.screw.tr{top:6px;right:6px;--r:-25deg}.screw.bl{bottom:6px;left:6px;--r:65deg}.screw.br{bottom:6px;right:6px;--r:5deg}

.plate{display:flex;align-items:stretch;justify-content:space-between;gap:14px}
.plate-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:14px}
h1{margin:0;min-width:0;font-family:var(--f-tape);font-weight:400;font-size:2.2rem;line-height:1;letter-spacing:.03em;white-space:nowrap;overflow:visible;display:flex;align-items:center;gap:.22em}
h1 .big{display:block;line-height:.9;white-space:nowrap}
/* first letter drawn from cables */
h1 .wl{position:relative;display:inline-block;width:.72em;height:.72em;vertical-align:0;margin:0 .05em 0 .06em}
h1 .wl[data-k="Щ"]{width:1.02em;margin:0 .09em 0 0}
h1 .wl svg{position:absolute;left:0;overflow:visible}
h1 .wl path{fill:none}
h1 .stack{display:flex;flex-direction:column;font-size:.42em;line-height:1.08;letter-spacing:.06em;word-spacing:-.4em}
/* main throttle: a U-handle with a rubber grip; folds up (on) or down (off) around the chrome mount */
/* main switch: rubber grip slides along a slot — top = on, bottom = off; height follows the title + load rows */
.lever{position:relative;flex:none;align-self:stretch;width:84px;min-height:54px;border:0;background:none;padding:0;cursor:grab}
.lever:active{cursor:grabbing}
.lever:disabled{cursor:wait}
.lv-track{position:absolute;left:50%;top:5px;bottom:5px;width:12px;margin-left:-6px;border-radius:6px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,.1) 55%,rgba(255,255,255,.1)),var(--slot);box-shadow:inset 2px 3px 4px rgba(0,0,0,.45),inset -1px -1px 1px rgba(255,255,255,.18),0 0 0 3px var(--plate),0 0 0 4px var(--edge),1px 1px 0 4px rgba(255,255,255,.22)}
.lv-grip{position:absolute;left:2px;right:2px;top:calc(100% - 24px);height:24px;border-radius:12px;border:1px solid var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.14em;color:#e9e4d6;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px),linear-gradient(180deg,#3d4651,#11161b);box-shadow:0 3px 5px rgba(0,0,0,.4);transition:top .4s cubic-bezier(.4,1.4,.5,1),color .2s}
.lever.up .lv-grip{top:0;color:#ffc860;box-shadow:0 3px 5px rgba(0,0,0,.4),0 0 10px -2px var(--amber)}
.lever:hover .lv-grip{border-color:var(--amber)}

.meter{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.meter-label{cursor:help;font-size:14px;font-weight:400;color:var(--muted)}
.segs{flex:1 1 150px;min-width:0;display:flex;gap:4px;flex-wrap:nowrap;cursor:help}
.seg{flex:1 1 0;max-width:16px;min-width:5px;height:12px;border-radius:2px;background:var(--track-off);border:1px solid var(--edge);transition:background .15s}
.seg.bonus{border:1px dashed var(--muted);background:transparent}
.seg.bonus.open{border:1px solid var(--amber);background:var(--amber-soft)}
.seg.fill{background:var(--amber);border-color:var(--amber)}
.seg.over{background:repeating-linear-gradient(45deg,var(--danger) 0 3px,var(--amber-soft) 3px 5px);border-color:var(--danger)}
/* counter: small inline readout right after the cells, same chip style as other marks */
.count{cursor:help;flex:none;display:inline-flex;align-items:baseline;gap:3px;padding:0 6px;border-radius:5px;background:var(--chip);border:1px solid var(--edge);color:var(--ink);font-weight:600;font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.count .sep{opacity:.45}
.count .c{color:var(--muted)}
.count.full .n{color:var(--amber-ink)}
.count.over .n{color:var(--danger)}

.rows{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge);cursor:pointer;user-select:none;min-width:0}
.row:last-child{border-bottom:0}
.tape{flex:0 1 auto;min-width:0;max-width:100%;background:var(--tape);color:var(--tape-ink);font-family:var(--f-tape);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px 5px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(var(--rot,0deg));text-shadow:0 1px 0 rgba(0,0,0,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 1px 2px rgba(0,0,0,.3);opacity:.55;transition:opacity .2s}
.row.on .tape,.row.frozen .tape{opacity:1}
.marks{display:flex;gap:4px;flex:none}
.mark{font-size:12px;font-weight:700;line-height:1;padding:4px 6px;border-radius:4px;background:var(--chip);color:var(--muted);border:1px solid var(--edge);cursor:help}
.mark:hover{border-color:var(--muted);color:var(--ink)}
.mark.coin{width:20px;height:20px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 2px var(--chip),inset 0 0 0 3px var(--edge)}
.mark.ice{color:var(--ice)}
.mark.boost{border:0;background:none;padding:4px 2px;font-size:11px;color:var(--muted)}
.mark svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;display:block}

.sw{position:relative;width:56px;height:30px;flex:none;border-radius:15px;border:1px solid var(--edge);background:var(--track-off);cursor:pointer;padding:0;transition:background .2s}
.knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .24s cubic-bezier(.3,1.45,.5,1);display:grid;place-items:center}
.knob .ic{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.row.on .knob .ic,.row.frozen .knob .ic{stroke:var(--knob-ico)}
.knob .lk{position:absolute;top:-5px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--tape);box-shadow:0 0 0 1.5px var(--amber);display:none;place-items:center}
.knob .lki{width:9px;height:9px;fill:none;stroke:#ffc860;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.row.frozen .knob .lk{display:grid}
.row.on .sw{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px -2px var(--amber)}
.row.on .knob,.row.frozen .knob{transform:translateX(26px)}
.row.frozen .sw{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px -2px var(--amber);cursor:not-allowed}
.sw:disabled{cursor:wait}

.row.trip .sw{animation:trip .7s ease}
@keyframes trip{0%,60%{background:var(--danger);border-color:var(--danger)}}
.row.trip .tape{animation:tapeTrip .5s ease}
@keyframes tapeTrip{15%{transform:rotate(var(--rot)) translateX(-4px)}30%{transform:rotate(var(--rot)) translateX(3px)}45%{transform:rotate(var(--rot)) translateX(0)}}
.row.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.panel.overload{animation:buzz .09s linear infinite}
.panel.overload .row.on .sw{animation:flick .18s steps(2) infinite}
@keyframes buzz{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes flick{50%{background:var(--danger);border-color:var(--danger)}}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.credits{position:absolute;z-index:3;left:0;right:0;top:100%;margin-top:2px;padding:0 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;line-height:1.3;pointer-events:none}
.credits > *{pointer-events:auto}
.credits .linkish{font-size:11.5px}
.author{margin:0;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.credits{padding:0 10px;font-size:11px}.credits .linkish{font-size:11px}.by-pre{display:none}.dv-cables .p5{display:none}}
.author a{color:var(--ink);text-underline-offset:3px}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

/* status row: comment text starts on the same left edge as the title and toggles; counter has a fixed slot on the right */
.status{display:flex;align-items:flex-start;gap:14px;margin:4px 0 12px}
.count-slot{flex:none;width:84px;display:flex;justify-content:center}
/* fixed height (2 lines; 3 on phones) so the switches below never jump; long jokes shrink to fit */
.display{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--muted);height:48px;overflow:visible;clip-path:inset(-4px -4px -4px -14px);padding-top:2px}
@media (max-width:420px){.display{font-size:13px;height:64px}}
.display .txt{display:inline;border-radius:6px;transition:background .25s,color .25s}
.display.msg .txt{background:var(--amber-soft);color:var(--ink);font-weight:600;margin-left:-8px;padding:2px 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.display.pop .txt{animation:pop .45s ease;display:inline-block}
@keyframes pop{0%{transform:translateX(-4px);opacity:.4}100%{transform:none;opacity:1}}
.tip{position:fixed;z-index:60;max-width:260px;background:var(--ink);color:var(--panel);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);pointer-events:none}

/* ---- settings drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--edge);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.drawer-head h2{margin:0;font-family:var(--f-tape);font-weight:400;font-size:1rem;letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--edge)}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tab-body{overflow:auto;padding:22px 18px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px;background:var(--sheet)}
.tab-body > *{flex:none}

/* level 0 — group label (Science) */
.grp{display:flex;flex-direction:column;gap:14px}
.grp > *{flex:none}
.grp-h{margin:0;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grp-h::after{content:"";flex:1;height:1px;background:var(--edge)}
/* level 1 — block */
.block{border:1px solid var(--edge);border-radius:14px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06),0 14px 28px -20px rgba(0,0,0,.55)}
.block-h{padding:12px 16px 11px;display:flex;flex-direction:column;gap:2px;background:var(--amber);color:var(--on-amber)}
.block-h h3{margin:0;font-size:17px;font-weight:700;line-height:1.3;color:var(--on-amber);letter-spacing:.01em}
.block-h .by{font-size:13px;color:var(--on-amber);opacity:.75}
.block-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.block-b p{margin:0;font-size:14px;max-width:62ch}
.block a{color:var(--ink);font-size:13px;text-underline-offset:3px;font-weight:600}
.help{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
/* level 2 — field inside a block */
.field{display:flex;flex-direction:column;gap:6px}
.field + .field{border-top:1px solid var(--edge);padding-top:14px}
.flabel{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px}
.flabel::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.field > :not(.flabel){margin-left:18px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline.preset-row > select{flex:1 1 140px;min-width:0}
@media (max-width:420px){.inline.preset-row > select{flex-basis:100%}}
.inline > input,.inline > select{flex:1;min-width:0}
input[type=text],select{background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.btn{border:1px solid var(--edge);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.warn{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.danger{color:var(--danger)}
.reset-row{display:flex;justify-content:flex-end}
.btn.warn:hover{filter:brightness(1.08)}
.icon-sm{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:7px;background:var(--bg);cursor:pointer;font-size:14px;line-height:1}
.icon-sm:disabled{opacity:.35;cursor:default}
.icon-sm.del{color:var(--danger)}
.err{margin:0;color:var(--danger);font-size:13px;font-weight:600}
.err:empty{display:none}

/* areas list: amber bullet = one area */
.edit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.edit-row{padding:10px 0;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--edge)}
.edit-row:first-child{border-top:0;padding-top:2px}
.ed-top{display:flex;gap:6px;align-items:center}
.bullet{flex:none;width:9px;height:9px;border-radius:50%;background:var(--amber);margin:0 3px 0 0}
.ed-top input.ed-name{flex:1;min-width:0;font-weight:700;font-size:15px;background:transparent;border:1px solid transparent;border-bottom:1px dashed var(--muted);border-radius:0;padding:5px 6px}
.ed-top input.ed-name:hover{border-bottom-style:solid}
.ed-top input.ed-name:focus{background:var(--bg);border:1px solid var(--amber);border-radius:6px}
.flags{display:flex;flex-wrap:wrap;gap:0 12px;padding-left:18px}
.flag{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--muted);padding:2px 0}
.flag input{margin:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:17px;height:17px;margin:0;border:1.5px solid var(--muted);border-radius:4px;background:var(--card);display:inline-grid;place-items:center;cursor:pointer}
input[type=checkbox]::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-amber);border-bottom:2px solid var(--on-amber);transform:translateY(-1px) rotate(-45deg);opacity:0}
input[type=checkbox]:checked{background:var(--amber);border-color:var(--amber)}
input[type=checkbox]:checked::after{opacity:1}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
input[type=radio]{appearance:none;-webkit-appearance:none;flex:none;width:17px;height:17px;margin:3px 0 0;border:1.5px solid var(--muted);border-radius:50%;background:var(--card);display:inline-grid;place-items:center;cursor:pointer}
input[type=radio]::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--on-amber);opacity:0}
input[type=radio]:checked{background:var(--amber);border-color:var(--amber)}
input[type=radio]:checked::after{opacity:1}
.flag:has(input:checked){color:var(--ink)}
.flag:has(input:disabled){opacity:.45;cursor:default}

.stepper{display:flex;align-items:center;border:1px solid var(--edge);border-radius:8px;width:max-content;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:38px;height:36px;cursor:pointer;font-size:18px}
.stepper output{min-width:48px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.radio{display:flex;flex-direction:column;gap:8px;font-size:14px}
.radio label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.consent{position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:13.5px;line-height:1.45}
.consent p{margin:0;flex:1;min-width:0}
.consent .acts{display:flex;gap:8px;flex:none}
@media (max-width:420px){.consent{flex-direction:column;align-items:stretch;gap:10px}.consent .acts > .btn{flex:1}}


.rule{border:1px solid var(--amber);border-radius:14px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rule h3{margin:0;font-size:17px;font-weight:700}
.rule p{margin:0;font-size:14px}
.split{display:flex;flex-direction:column;gap:8px}
.split > div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tag{flex:none;font-weight:700;font-size:12px;padding:3px 7px;border-radius:5px;min-width:46px;text-align:center}
.tag.a{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber)}
.tag.b{background:var(--chip);color:var(--ink);border:1px solid var(--ice)}
.hist{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.callout{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.plateau{width:100%;max-width:340px;height:auto}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(10,14,18,.45);padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.modal-card textarea{width:100%;min-height:220px;background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:10px;font:inherit;font-size:14px}

@media (max-width:420px){.panel{padding:36px 32px 34px}.panel::before{inset:18px}.screw{width:12px;height:12px}.screw::before,.screw::after{width:7px;margin-left:-3.5px}.screw.tl,.screw.tr{top:3px}.screw.bl,.screw.br{bottom:3px}.screw.tl,.screw.bl{left:3px}.screw.tr,.screw.br{right:3px}.tape{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  sci:{
   bits:{h:'А хіба не можна потроху?',by:'Наш погляд',
     ps:['Можна — і більшість людей саме так і живе. Тумблер на щитку означає не «є в житті / немає в житті», а «у фокусі / не у фокусі».',
         'Вимкнена сфера нікуди не зникає. Ви не перестаєте любити друзів, коли тумблер «Друзі» вимкнений, і не кидаєте спорт назавжди. Просто зараз ви не вкладаєте туди найкращі сили: сфера працює у фоні, на мінімумі.'],
     items:['Щиток стверджує лише одне: неможливо, щоб усе було «на повну» одночасно — блискучі стосунки, бездоганне здоров’я, стрімка кар’єра і подорожі щомісяця.',
            '«Потроху» в кількох сферах — це не провал, а нормальний стан. Гіпотеза розширення вище навіть каже, що кілька ролей одночасно часто додають енергії.',
            'Фокус можна переставляти. Цього року увімкнена кар’єра, наступного — сім’я. Саме про це і теорія конфорок, і Pick Three: не «обери назавжди», а «обери на цей період».'],
     end:'Тож щиток — не вирок, а нагадування: якщо зараз щось вимкнено, ви цього не втратили. Ви просто обрали, куди світити.'},
   nomoney:{h:'Чи можна сьогодні жити без грошей',by:'Наш погляд',intro:'Чесна відповідь: майже ні, але гроші тут не «головне».',items:['Без грошей зовсім живуть одиниці: монастирі, громади на кшталт амішів, люди в повному самозабезпеченні. У місті без грошей не закрити навіть базове: житло, їжу, ліки.','Але гроші — це не щастя, а місткість. На щитку гроші не роблять жодну сферу кращою. Вони лише дають місце, і самі одне з них забирають. Тобто гроші — це підсилювач, а не мета.','Саме так це показує дослідження Whillans нижче: гроші допомагають, коли ними купують час.','Гроші на щитку не обов’язкові: зніміть галочку «Джерело грошей» або оберіть набір «Дауншифтер».']},
   burners:{h:'Теорія чотирьох конфорок',by:'Девід Седаріс · популяризував Джеймс Клір',p:'У житті чотири конфорки: сім’я, друзі, робота, здоров’я. Щоб досягти успіху, одну доводиться вимкнути. Щоб досягти великого успіху — дві. Конфорки можна перемикати залежно від періоду життя.',at:'jamesclear.com'},
   pick3:{h:'Pick Three',by:'Ренді Цукерберг · книга, 2018',p:'П’ять сфер: робота, сон, сім’я, фітнес, друзі. Щодня обирайте три, а завтра можна інші три. Авторка пропонує жити «well-lopsided» — свідомо перекошено, а не ідеально збалансовано.',at:'Інтерв’ю для Salon'},
   scarcity:{h:'Гіпотеза дефіциту (scarcity)',by:'Goode, 1960 · Marks, 1977 · Greenhaus і Beutell, 1985',p:'Час і енергія людини обмежені. Кожна нова роль забирає ресурс в інших, і між ролями виникає конфлікт — наприклад, між роботою і сім’єю. Саме на цій ідеї тримається механіка щитка.',at:'Огляд досліджень (PDF)'},
   expansion:{h:'Гіпотеза розширення (expansion)',by:'Sieber, 1974 · Marks, 1977',p:'Протилежний погляд: ролі можуть не лише забирати енергію, а й давати її. Чимало досліджень показують, що люди з кількома ролями в середньому здоровіші. Наука досі сперечається, тому щиток — метафора, а не закон природи.',at:'Огляд досліджень'},
   whillans:{h:'Гроші як купівля часу',by:'Whillans та ін. · PNAS, 2017',p:'Опитали 6 271 людину у США, Канаді, Данії та Нідерландах. Ті, хто платить за послуги, що економлять час (прибирання, доставка їжі), задоволеніші життям. В експерименті покупка часу підняла настрій більше, ніж покупка речей.',at:'Стаття в PNAS'},
   plateau:{h:'Дохід і щастя: плато',by:'Kahneman, Killingsworth, Mellers · PNAS, 2023',
     what:'Що таке плато. Як у географії: гора з пласкою верхівкою. На графіку лінія спочатку йде вгору, а потім стає рівною — гроші ростуть, а щастя вже ні.',
     hist:['2010, Kahneman: щастя росте до 75 тис. доларів на рік, далі — плато для всіх.','2021, Killingsworth: жодного плато, щастя росте й далі.','2023, разом: обидва частково праві.'],
     groups:[['85%','a','Більшість людей: чим більше грошей, тим щасливіші — і після 100 тис. теж. Стелі немає.'],['15%','b','Найменш щасливі: щастя росте до ~100 тис., а далі зупиняється. Більше грошей їм уже не допомагає.']],
     why:'Чому так: у цих людей нещастя має причини, які гроші не лікують — хвороба, втрата близької людини, депресія. Гроші знімають побутові проблеми, але далі — плато.',
     note:'Суми — річний дохід домогосподарства в США, з поправкою на інфляцію. Для дорогих міст 100 тис. — зовсім інший рівень, ніж для маленьких.',at:'ScienceDaily'}

  rule:(b,n)=>`Money gives +${b} slot${b===1?'':'s'}, but takes one itself. Money buys time and eats time. ${n} of ${n} is impossible even with money: billionaires get 24 hours too.`,

  sci:{
   bits:{h:'Can’t I have a little of everything?',by:'Our take',
     ps:['You can, and most people live exactly like that. A switch on this panel doesn’t mean “in my life / not in my life”. It means “in focus / not in focus”.',
         'An area that is off doesn’t disappear. You don’t stop loving your friends when “Friends” is off, and you don’t quit sport forever. You just aren’t giving it your best energy right now: it runs in the background, on low.'],
     items:['The panel makes only one claim: you can’t have everything at full power at once — a brilliant relationship, perfect health, a fast-rising career and a trip every month.',
            'A little of several things isn’t failure, it’s the normal state. The expansion hypothesis above even says that several roles at once often give energy.',
            'Focus can move. This year career is on, next year family. That’s the point of both the Four Burners and Pick Three: not “choose forever”, but “choose for this season”.'],
     end:'So the panel isn’t a verdict, it’s a reminder: if something is off right now, you haven’t lost it. You’ve just chosen where to shine the light.'},
   nomoney:{h:'Can you live without money today?',by:'Our take',intro:'Honest answer: almost not, but money is not “the main thing” here.',items:['Very few people live with no money at all: monasteries, communities like the Amish, people who are fully self-sufficient. In a city, you can’t even cover the basics without money: housing, food, medicine.','But money is capacity, not happiness. On this panel money doesn’t make any area better. It only gives slots, and takes one itself. Money is an amplifier, not a goal.','That’s what the Whillans study below shows: money helps when you use it to buy time.','Money is optional on the panel: untick “Money source”, or load the Downshifter set.']},
   burners:{h:'Four Burners Theory',by:'David Sedaris · popularised by James Clear',p:'Life has four burners: family, friends, work and health. To be successful you have to turn one off. To be very successful, two. You can switch burners as your season of life changes.',at:'jamesclear.com'},
   pick3:{h:'Pick Three',by:'Randi Zuckerberg · book, 2018',p:'Five areas: work, sleep, family, fitness, friends. Pick three each day, and a different three tomorrow. She calls it being “well-lopsided” instead of perfectly balanced.',at:'Interview in Salon'},
   scarcity:{h:'Scarcity hypothesis',by:'Goode, 1960 · Marks, 1977 · Greenhaus & Beutell, 1985',p:'A person’s time and energy are limited. Each new role takes resources from the others, and roles start to conflict, for example work and family. The mechanics of this panel rest on that idea.',at:'Research review (PDF)'},
   expansion:{h:'Expansion hypothesis',by:'Sieber, 1974 · Marks, 1977',p:'The opposite view: roles can create energy as well as use it. Many studies find that people with several roles are, on average, healthier. Science still argues about it, so this panel is a metaphor, not a law of nature.',at:'Research review'},
   whillans:{h:'Money buys time',by:'Whillans et al. · PNAS, 2017',p:'A survey of 6,271 people in the US, Canada, Denmark and the Netherlands. People who pay for time-saving services (cleaning, food delivery) are more satisfied with life. In an experiment, buying time lifted mood more than buying things.',at:'Paper in PNAS'},
   plateau:{h:'Income and happiness: the plateau',by:'Kahneman, Killingsworth, Mellers · PNAS, 2023',
     what:'What a plateau is. Like in geography: a mountain with a flat top. On a chart the line goes up and then turns flat: money keeps growing, happiness doesn’t.',

     groups:[['85%','a','Most people: more money, more happiness, also above $100k. No ceiling.'],['15%','b','The least happy: happiness rises up to ~$100k and then stops. More money no longer helps them.']],
     why:'Why: their unhappiness has causes money can’t cure, such as illness, losing someone close, or depression. Money removes everyday problems, and after that comes the plateau.',
     note:'Figures are yearly US household income, adjusted for inflation. In an expensive city $100k means something very different than in a small town.',at:'ScienceDaily'}

function cut(id){let h=7;for(const ch of id)h=(h*17+ch.charCodeAt(0))|0;return Math.abs(h)%3;}

function buildList(){
  rowsEl.innerHTML=S.cats.map(c=>{
    const nm=esc(nameOf(c));
    const marks=(c.isMoney?`<button type="button" class="mark boost" data-tip="${esc(t('tipSrc')(S.settings.bonus))}" aria-label="${esc(t('tipSrc')(S.settings.bonus))}">+${Math.max(0,S.settings.bonus-1)}</button>`:'')+
      (c.money?`<button type="button" class="mark coin" data-tip="${esc(t('tipMoney'))}" aria-label="${esc(t('tipMoney'))}">$</button>`:'')+
'';
    return `<li class="row" data-id="${c.id}">
      <button type="button" class="sw" role="switch" id="sw-${c.id}" aria-label="${nm}"><span class="knob">${catIcon(c)}<span class="lk" aria-hidden="true">${glyph('lock','lki')}</span></span></button>
      <span class="tape" style="--rot:${rot(c.id)}deg"${!c.label&&HINTS[lang][c.key]?` data-hint="${esc(HINTS[lang][c.key])}"`:` title="${nm}"`}>${nm}</span>
      ${marks?`<span class="marks">${marks}</span>`:''}
    </li>`;}).join('');
  update();
}
function update(){
  const on=S.on;
  const anyOn=on.some(id=>{const c=cat(id);return c&&!c.frozen;});
  for(const li of rowsEl.children){
    const c=cat(li.dataset.id);if(!c)continue;
    const isOn=on.includes(c.id);
    li.classList.toggle('on',isOn&&!c.frozen);
    li.classList.toggle('frozen',!!c.frozen);
    const b=li.querySelector('.sw');b.setAttribute('aria-checked',String(isOn));b.disabled=busy;
  }
  const cap=capOf(S,on),mc=maxCap(S),bc=baseCap(S),mOn=moneyOn(S,on);
  const total=Math.max(mc,on.length);let html='';
  for(let i=0;i<total;i++){
    const cls=['seg'];
    if(i>=bc&&i<mc){cls.push('bonus');if(mOn)cls.push('open');}
    if(i<on.length)cls.push(i>=cap?'over':'fill');
    html+=`<span class="${cls.join(' ')}"></span>`;
  }
  segsEl.innerHTML=html;
  countEl.innerHTML=`<span class="n">${on.length}</span><span class="sep">/</span><span class="c">${cap}</span>`;
  countEl.classList.toggle('full',on.length===cap);
  countEl.classList.toggle('over',on.length>cap);
  countEl.dataset.tip=t('meterTip')(cap,bc,S.settings.bonus);
  segsEl.dataset.tip=t('tipSegs')(mc-bc);
  const ab=$('btnAll');ab.classList.toggle('up',anyOn);ab.setAttribute('aria-checked',String(anyOn));ab.disabled=busy;
  ab.dataset.tip=anyOn?t('leverOffTip'):t('leverOnTip');$('lvText').textContent=anyOn?t('lvOn'):t('lvOff');ab.setAttribute('aria-label',ab.dataset.tip);
  if(!msgHold)showIdle();
}


/* ---------- status display (replaces toasts) ---------- */
let msgHold=false;  // a joke stays until the next action
function clearMsg(){msgHold=false;}
function fitMsg(){
  displayEl.style.fontSize='';let fs=parseFloat(getComputedStyle(displayEl).fontSize),g=0;
  while(displayEl.scrollHeight>displayEl.clientHeight+1&&fs>10.5&&g++<12){fs-=.5;displayEl.style.fontSize=fs+'px';}
}
function showIdle(){
  const cap=capOf(S,S.on),n=S.on.length;
  displayEl.classList.remove('msg');displayEl.classList.add('idle');
  displayTxt.textContent=n===0?t('idleNone'):(n>=cap?t('idleFull'):t('idleFree')(cap-n));
  fitMsg();
}
function say(msg){
  msgHold=true;
  displayEl.classList.remove('idle','pop');void displayTxt.offsetWidth;displayEl.classList.add('msg','pop');
  displayTxt.textContent=msg;
  fitMsg();
}
const toast=say;

/* ---------- tooltips ---------- */
const tip=document.createElement('div');tip.className='tip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
let tipFor=null;
function showTip(el){
  tipFor=el;tip.textContent=el.dataset.tip||el.dataset.hint;tip.hidden=false;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  const x=Math.max(8,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-8));
  let y=r.top-th-8;if(y<8)y=r.bottom+8;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const m=e.target.closest&&e.target.closest('[data-tip],[data-hint]');if(m&&m!==tipFor&&!(noHover&&!m.classList.contains('mark')))showTip(m);});
document.addEventListener('mouseout',e=>{const m=e.target.closest&&e.target.closest('[data-tip],[data-hint]');if(m&&!m.contains(e.relatedTarget))hideTip();});
const noHover=window.matchMedia&&matchMedia('(hover: none)').matches;
document.addEventListener('focusin',e=>{const m=e.target.closest&&e.target.closest('[data-tip]');if(m&&!(noHover&&!m.classList.contains('mark')))showTip(m);else hideTip();});
document.addEventListener('focusout',e=>{if(e.target===tipFor)hideTip();});
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('[data-tip]');if(!m&&tipFor)hideTip();},true);
window.addEventListener('scroll',hideTip,true);
function rowEl(id){return rowsEl.querySelector(`.row[data-id="${id}"]`);}
function flash(id,cls,ms){const r=rowEl(id);if(!r)return;r.classList.remove(cls);void r.offsetWidth;r.classList.add(cls);setTimeout(()=>r.classList.remove(cls),ms);}
const trip=id=>flash(id,'trip',750);
const shake=id=>flash(id,'shake',450);

const rnd=a=>a[Math.floor(Math.random()*a.length)];

function commit(on,victims){S.on=on;save();update();victims.forEach(trip);}
function toggle(id){
  if(busy)return;clearMsg();const c=cat(id);if(!c)return;
  if(c.frozen){shake(id);toast(fmt(t('frozenTap'),{x:nameOf(c)}));return;}
  const on=S.on.slice();
  if(on.includes(id)){
    on.splice(on.indexOf(id),1);
    if(c.isMoney){
      const r=settle(S,on,null);
      if(!r.ok){shake(id);toast(t('noRoomWithoutMoney'));return;}
      commit(on,r.victims);
      toast(r.victims.length?fmt(t('moneyGone'),{off:joinNames(r.victims)}):t('moneyOffOk'));
    } else commit(on,[]);
    return;
  }
  const wasDead=!on.some(x=>!cat(x).frozen);
  on.push(id);
  const r=settle(S,on,id);
  if(!r.ok){shake(id);toast(fmt(t('sacred'),{x:nameOf(c)}));return;}
  commit(on,r.victims);
  if(wasDead&&!c.isMoney){toast(fmt(t('alive'),{on:nameOf(c)}));return;}
  if(c.isMoney&&!S.seen.moneyIntro){S.seen.moneyIntro=true;save();toast(t('moneyIntro')(S.settings.bonus));}
  if(!r.victims.length)return;
  const mv=r.victims.find(v=>cat(v).isMoney);
  if(mv){const rest=r.victims.filter(v=>v!==mv);toast(fmt(t(rest.length?'moneyEaten':'moneyEatenSolo'),{on:nameOf(c),off:joinNames(rest)}));}
  else if(moneyOn(S,on)&&Math.random()<.5)toast(fmt(t('billionaire'),{off:joinNames(r.victims)}));
  else toast(fmt(rnd(t('combo')),{on:nameOf(c),off:joinNames(r.victims)}));
}
rowsEl.addEventListener('click',e=>{
  const m=e.target.closest('[data-tip]');
  if(m){e.stopPropagation();if(tipFor===m)hideTip();else showTip(m);return;}
  const li=e.target.closest('.row');if(li)toggle(li.dataset.id);
});
$('btnAll').addEventListener('click',()=>{if(busy)return;if(S.on.some(id=>!cat(id).frozen))allOff();else tryAll(true);});

function setBusy(b){busy=b;$('btnSettings').disabled=b;update();}
async function tryAll(fromCurrent){
  if(busy)return;clearMsg();setBusy(true);
  if(!fromCurrent){S.on=S.cats.filter(c=>c.frozen).map(c=>c.id);update();}
  if(reduceMotion){S.on=S.cats.map(c=>c.id);settle(S,S.on,null);setBusy(false);save();toast(t('tryAllDone'));return;}
  await sleep(380);
  for(const c of S.cats){if(!S.on.includes(c.id)){S.on.push(c.id);update();await sleep(380);}}
  await sleep(350);panel.classList.add('overload');await sleep(1800);panel.classList.remove('overload');
  let g=0;
  while(S.on.length>capOf(S,S.on)&&g++<50){const v=pick(S,S.on,null);if(!v)break;S.on.splice(S.on.indexOf(v),1);update();trip(v);await sleep(560);}
  setBusy(false);save();toast(t('tryAllDone'));
}
async function allOff(){
  if(busy)return;clearMsg();setBusy(true);
  const victims=S.on.filter(id=>!cat(id).frozen).reverse();
  for(const id of victims){S.on.splice(S.on.indexOf(id),1);update();if(!reduceMotion)await sleep(140);}
  setBusy(false);save();
  toast(S.on.length?t('allOffFrozen'):rnd(t('allOff')));
}
function runStart(){
  if(S.settings.start==='tryall')tryAll();
  else{S.on=S.cats.filter(c=>c.frozen).map(c=>c.id);save();update();}
}

function setErr(k){errMsg=k?t(k):'';document.querySelectorAll('.err').forEach(e=>e.textContent=errMsg);}
function tryMutate(fn,errKey,custom){
  const st=JSON.parse(JSON.stringify(S));
  if(fn(st)===false){setErr(errKey);return false;}
  normalize(st);
  const r=settle(st,st.on,null);

const WL={};
/* Wire letters (U in English, Щ in Ukrainian): every stroke is a bundle of thin wires.
   The legs rise to the inner field edge, vanish under the frame and reappear above the panel. */
const UCOLS=['#7d8790','#f0be2a','#aab3bb','#d8c98f','#4c545c','#e2a417'];
function wireLetter(k,W,s,ext){
  const n=UCOLS.length,T=-ext;let out='',xs=[],below=0;
  if(k==='U'){
    const p=s*.36/n,w=p*.92;
    for(let i=0;i<n;i++){
      const xl=p*(i+.5),xr=W-xl,bot=s-p*(i+.5),r=(xr-xl)/2,yc=bot-r;
      out+=`<path d="M${xl} ${T} V${yc} A${r} ${r} 0 0 0 ${xr} ${yc} V${T}" stroke="${UCOLS[i]}" stroke-width="${w}"/>`;
      xs.push([xl,UCOLS[i],w],[xr,UCOLS[i],w]);
    }
  } else {
    const p=s*.32/n,w=p*.95,band=p*n,R0=p*.6,tail=s*.2,lr=band*.62;below=tail+lr*2+2;
    for(let i=0;i<n;i++){            // left leg turning into the bottom bar
      const xl=p*(i+.5),yb=s-p*(i+.5),r=R0+(n-1-i)*p;
      out+=`<path d="M${xl} ${T} V${yb-r} A${r} ${r} 0 0 0 ${xl+r} ${yb} H${W-band}" stroke="${UCOLS[i]}" stroke-width="${w}"/>`;
      xs.push([xl,UCOLS[i],w]);
    }
    for(let i=0;i<n;i++){            // middle leg, down into the bar
      const x=W/2-band/2+p*(i+.5),c=UCOLS[(i+2)%n];
      out+=`<path d="M${x} ${T} V${s-band}" stroke="${c}" stroke-width="${w}"/>`;xs.push([x,c,w]);
    }
    for(let i=0;i<n;i++){            // right leg runs straight through into the tail
      const x=W-band+p*(i+.5),c=UCOLS[(i+4)%n];
      out+=`<path d="M${x} ${T} V${s+tail}" stroke="${c}" stroke-width="${w}"/>`;xs.push([x,c,w]);
    }
    const cx=W-band/2,cy=s+tail+lr*.75;  // the tail ends in a brass cable lug
    out+=`<circle cx="${cx}" cy="${cy}" r="${lr}" fill="#c9a03a" stroke="#8a6a1e" stroke-width="${p*.6}"/><circle cx="${cx}" cy="${cy}" r="${lr*.42}" style="fill:var(--panel)"/>`;
  }
  return {out,xs,below};
}
function drawU(){
  const cu=document.querySelector('.dv-cables .cu'),ct1=document.querySelector('.dv-cables .ct1');
  const el=document.querySelector('h1 .wl');
  if(!el){if(cu)cu.innerHTML='';if(ct1)ct1.style.left='';return;}
  const k=el.dataset.k,box=$('box').getBoundingClientRect(),pr=panel.getBoundingClientRect(),ur=el.getBoundingClientRect();
  const inset=parseFloat(getComputedStyle(panel,'::before').top)||26;
  const fieldTop=pr.top+panel.clientTop+inset,s=ur.height,W=ur.width,ext=Math.max(0,ur.top-fieldTop);
  const g=wireLetter(k,W,s,ext),H=ext+s+g.below;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 ${-ext} ${W} ${H}" style="top:${-ext}px;width:${W}px;height:${H}px">${g.out}</svg>`;
  if(cu){
    const L=2000,h=L+(pr.top-box.top)+6,left=ur.left-box.left;
    cu.setAttribute('viewBox',`0 0 ${W} ${h}`);
    cu.style.cssText=`left:${left}px;top:-${L}px;width:${W}px;height:${h}px`;
    cu.innerHTML=g.xs.map(([x,c,w])=>`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${c}" stroke-width="${w}"/>`).join('');
    /* the other two bundles go only where the top buttons are not: they must never run under them */
    const lim=document.querySelector('.topbar .lang').getBoundingClientRect().left-box.left-12;
    const span=svg=>{let a=1e9,b=-1e9;svg.querySelectorAll('line').forEach(l=>{const x=+l.getAttribute('x1'),w=+l.getAttribute('stroke-width')/2;a=Math.min(a,x-w);b=Math.max(b,x+w);});return [a,b];};
    let occ=left+W;
    if(ct1){
      const [a,b]=span(ct1);let x=null;
      for(const g of [6,4,2]){if(left-g-b+a>=4){x=left-g-b;break;}}
      if(x==null){x=left+W+6-a;if(x+b>lim)x=null;else occ=x+b;}
      ct1.style.display=x==null?'none':'';if(x!=null)ct1.style.left=x+'px';
    }
    const ct2=document.querySelector('.dv-cables .ct2');
    if(ct2){
      const [a,b]=span(ct2),z0=occ+28,z1=lim;
      if(z1-z0>=b-a){ct2.style.display='';ct2.style.right='auto';ct2.style.left=((z0+z1)/2-(a+b)/2)+'px';}
      else ct2.style.display='none';
    }
  }
}

  const q=new URLSearchParams(location.search),al={startup:'founder',startuper:'founder',art:'artist',painter:'artist',parent:'parents',dev:'it',downshifter:'downshift'};
  let v=(q.get('set')||'').toLowerCase().trim();v=al[v]||v;if(PRESETS[v])urlSet=v;
  const ql=(q.get('lang')||'').toLowerCase();if(ql==='uk'||ql==='en')S.lang=ql;
  if(q.has('set')||q.has('lang'))history.replaceState(null,'',location.pathname+location.hash);
}catch(e){}
let urlFresh=false;
if(urlSet&&(!saved||S.preset!==urlSet)){S.preset=urlSet;S.cats=fromPreset(urlSet);S.on=[];urlFresh=true;save();}
lang=detectLang();
applyLang();
applyTheme();
applyDecor();
if(!saved||urlFresh)setTimeout(runStart,600);
else{const r=settle(S,S.on,null);if(r.ok)save();update();}
})();
</script>
